[package]
name = "ddmrp_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ddmrp_core"
path = "src/lib.rs"

[[bin]]
name = "ddmrp_core"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
# Lectura/escritura masiva (cliente sincrono; COPY binario/CSV)
postgres = "0.19"
# Fase siguiente: polars para ventanas de ADU sobre el historico completo
# polars = { version = "0.45", features = ["lazy", "parquet"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
