server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types application/json application/javascript text/css;
  client_max_body_size 300m;

  # la API: nunca se guarda en cache (datos del negocio y tokens), y se le pasa al backend de donde viene la peticion
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 900s; proxy_send_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/seguridad.inc;
  }
  # archivos con hash en el nombre: no cambian nunca, se pueden guardar un año
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/seguridad.inc;
  }
  # la pagina: siempre se revisa, para que un despliegue nuevo llegue sin Ctrl+F5
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/seguridad.inc;
  }
}
